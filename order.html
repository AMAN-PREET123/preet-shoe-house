<!DOCTYPE html>
<html>

<head>

    <title>Place Order - Preet Shoe House</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5ead9;
            color: #222;
        }

        .top-bar {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        .navbar {
            background-color: white;
            padding: 10px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }

        .navbar img {
            width: 200px;
            height: 90px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 22px;
        }

        .nav-links a {
            color: #222;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #c58b2a;
        }

        .order-section {
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .order-section h1 {
            text-align: center;
            color: #111;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .place-order {
            background-color: #c58b2a;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            display: block;
            margin: 25px auto 0;
        }

        .place-order:hover {
            background-color: #111;
        }

        .footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }

        .footer h2 {
            color: #c58b2a;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .order-section {
                width: 85%;
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="top-bar">
        Free Delivery on Orders Over ₹1990
    </div>


    <div class="navbar">

        <img src="logo1.png" alt="Preet Shoe House Logo">

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="men.html">Men</a>
            <a href="women.html">Women</a>
            <a href="kids.html">Kids</a>
            <a href="sports.html">Sports</a>
            <a href="offers.html">Offers</a>
            <a href="contact.html">Contact Us</a>

        </div>

    </div>


    <div class="order-section">

        <h1>Place Your Order</h1>

        <div class="form-group">

            <label>Full Name</label>

            <input type="text" placeholder="Enter your full name">

        </div>


        <div class="form-group">

            <label>Phone Number</label>

            <input type="tel" placeholder="Enter your phone number">

        </div>


        <div class="form-group">

            <label>Address</label>

            <textarea placeholder="Enter your complete address"></textarea>

        </div>


        <div class="form-group">

            <label>Select Size</label>

            <select>

                <option>Select Size</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>

            </select>

        </div>

     <a href="confirmation.html">
        <button class="place-order">
            PLACE ORDER
        </button>
     </a>
    </div>


    <div class="footer">

        <h2>PREET SHOE HOUSE</h2>

        <p>
            Stylish. Comfortable. Made for Every Step.
        </p>

        <p>
            © 2026 Preet Shoe House. All Rights Reserved.
        </p>

    </div>
    </script>
</body>

</html>
